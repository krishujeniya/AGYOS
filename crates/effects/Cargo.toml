[package]
name = "effects"
version = "0.1.0"
edition = "2021"
authors = ["Krish Ujeniya <100012208+krishujeniya@users.noreply.github.com>"]
description = "AGYOS Privileged Effect Broker and Saga Compensator in Rust"
license = "MIT"
repository = "https://github.com/krishujeniya/AGYOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
domain = { path = "../domain" }
store = { path = "../store" }

[lib]
name = "effects"
path = "src/lib.rs"
