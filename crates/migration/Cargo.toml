[package]
name = "agyos-migration"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
agyos-domain = { path = "../domain", package = "agyos-domain" }
agyos-store = { path = "../store", package = "agyos-store" }
agyos-toon-codec = { path = "../toon-codec", package = "agyos-toon-codec" }
