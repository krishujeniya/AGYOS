[package]
name = "migration"
version = "0.1.0"
edition = "2021"
authors = ["Krish Ujeniya <100012208+krishujeniya@users.noreply.github.com>"]
description = "AGYOS Migration, State Mapping, Shadow Reading, and Reversal Qualification Engine"
license = "MIT"
repository = "https://github.com/krishujeniya/AGYOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
domain = { path = "../domain" }
store = { path = "../store" }
toon-codec = { path = "../toon-codec" }

[features]
default = []
test-support = []

[lib]
name = "migration"
path = "src/lib.rs"
