[package]
name = "store"
version = "0.1.0"
edition = "2021"
authors = ["Krish Ujeniya <100012208+krishujeniya@users.noreply.github.com>"]
description = "AGYOS Embedded Transactional Store and Atomic Outbox in Rust"
license = "MIT"
repository = "https://github.com/krishujeniya/AGYOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
domain = { path = "../domain" }
toon-codec = { path = "../toon-codec" }

[lib]
name = "store"
path = "src/lib.rs"
