[package]
name = "telemetry"
version = "0.1.0"
edition = "2021"
authors = ["Krish Ujeniya <100012208+krishujeniya@users.noreply.github.com>"]
description = "AGYOS Local Production Qualification, Redacted Metrics, and Operational Telemetry Engine"
license = "MIT"
repository = "https://github.com/krishujeniya/AGYOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
domain = { path = "../domain" }
store = { path = "../store" }
runtime = { path = "../runtime" }
toon-codec = { path = "../toon-codec" }

[lib]
name = "telemetry"
path = "src/lib.rs"
