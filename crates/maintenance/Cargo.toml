[package]
name = "maintenance"
version = "0.1.0"
edition = "2021"
authors = ["Krish Ujeniya <100012208+krishujeniya@users.noreply.github.com>"]
description = "AGYOS Retirement, Canary Observation, Vendor-Independent Export/Restore, and Risk Maintenance Engine"
license = "MIT"
repository = "https://github.com/krishujeniya/AGYOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
domain = { path = "../domain" }
store = { path = "../store" }
migration = { path = "../migration" }
telemetry = { path = "../telemetry" }
release = { path = "../release" }
toon-codec = { path = "../toon-codec" }

[lib]
name = "maintenance"
path = "src/lib.rs"
