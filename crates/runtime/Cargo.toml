[package]
name = "runtime"
version = "0.1.0"
edition = "2021"
authors = ["Krish Ujeniya <100012208+krishujeniya@users.noreply.github.com>"]
description = "AGYOS Autonomous Runtime, Progressive Routing, and Council Deliberation Engine"
license = "MIT"
repository = "https://github.com/krishujeniya/AGYOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
domain = { path = "../domain" }
catalog = { path = "../catalog" }
governance = { path = "../governance" }
toon-codec = { path = "../toon-codec" }

[features]
default = []
test-support = []

[lib]
name = "runtime"
path = "src/lib.rs"
