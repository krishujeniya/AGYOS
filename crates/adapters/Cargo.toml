[package]
name = "adapters"
version = "0.1.0"
edition = "2021"
authors = ["Krish Ujeniya <100012208+krishujeniya@users.noreply.github.com>"]
description = "AGYOS Scoped Business Effects and Adapter Qualification Engine"
license = "MIT"
repository = "https://github.com/krishujeniya/AGYOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
domain = { path = "../domain" }
governance = { path = "../governance" }
effects = { path = "../effects" }
store = { path = "../store" }
toon-codec = { path = "../toon-codec" }

[lib]
name = "adapters"
path = "src/lib.rs"
