services:
  agyos-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agyos_engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/', timeout=2).close()"]
      interval: 20s
      timeout: 3s
      retries: 3
    networks:
      - agyos-net

networks:
  agyos-net:
    driver: bridge
