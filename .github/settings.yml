# Declarative GitHub repository settings (Probot Settings / Safe-Settings schema)
repository:
  name: AGYOS
  description: Autonomous Cognitive Operating System for AGY CLI
  homepage: https://agyos.pages.dev
  default_branch: main
  has_issues: true
  has_projects: true
  has_wiki: false
  has_discussions: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - validate
          - council
          - documentation-pages
          - documentation-image
          - secret-detection
      enforce_admins: false
      required_pull_request_reviews: null
      restrictions: null
