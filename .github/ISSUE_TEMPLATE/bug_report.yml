name: "Bug Report"
description: "File a structured bug report to help us improve AGYOS."
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A concise summary of the bug.
      placeholder: "e.g., Fast decision router fails on empty string query"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the issue.
      placeholder: |
        1. Run `gemini/bin/agyos decide ""`
        2. Observe exception output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Should return a structured validation error instead of unhandled exception."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred? Include error traces or outputs.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      options:
        - "CLI (gemini/bin/agyos)"
        - "AGYOS Decision Kernel (gemini/agyos_decision)"
        - "MCP State Server (gemini/mcp/state-server.cjs)"
        - "Skills Catalog (2,289 Skills)"
        - "104-Role Matrix"
        - "Static Docs Portal (frontend/)"
        - "Cloudflare Pages Deployment"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python (uv) version, Node version.
      placeholder: "Linux x86_64, Node 24.11, Python 3.12 (uv 0.13)"
    validations:
      required: false
