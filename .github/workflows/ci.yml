name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python Syntax
        run: |
          python -m compileall .
      - name: Verify generated catalog matches every physical runbook
        run: |
          python scripts/build_tiered_skills_manifest.py
          python scripts/build_docs_data.py
          git diff --exit-code -- .agents/skills-manifest.json .agents/tier1-skills.json docs/skills-data.json docs/ai-catalog.json docs/llms.txt docs/sitemap.xml docs/robots.txt
      - name: Check AGY startup contracts
        run: python -m unittest discover -s scripts/tests -v
