name: Remote Builder

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Specific commit SHA to build'
        required: false

jobs:
  build-rust-kernel:
    name: Build Rust Kernel and Verify Reproducibility
    runs-on: ubuntu-latest
    env:
      AGYOS_BUILD_GIT_SHA: ${{ github.event.inputs.target_sha || github.sha }}
    steps:
      - name: Check out target revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha || github.sha }}

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          targets: x86_64-unknown-linux-gnu

      - name: Compile bootstrap driver
        run: rustc bootstrap.rs -o bootstrap

      - name: Verify build profiles and dependency lock
        run: ./bootstrap --verify-only

      - name: Materialize workspace and build release artifacts
        run: ./bootstrap --build

      - name: Run TOON Codec test suite and conformance verification
        run: cargo test --release --locked --workspace

      - name: Verify build reproducibility via independent rebuild
        run: |
          mkdir -p target/build_1 target/build_2
          cp target/release/agyos target/release/agyos-worker target/release/toon target/build_1/
          (cd target/build_1 && sha256sum agyos agyos-worker toon) > build_1.sha256
          cargo clean
          ./bootstrap --build
          cp target/release/agyos target/release/agyos-worker target/release/toon target/build_2/
          (cd target/build_2 && sha256sum agyos agyos-worker toon) > build_2.sha256
          diff -u build_1.sha256 build_2.sha256
          echo "Reproducible build verification: Bit-for-bit identical binary digests confirmed across independent builds."

      - name: Calculate and verify artifact digests
        run: |
          sha256sum target/release/agyos target/release/agyos-worker target/release/toon | tee artifacts.sha256

      - name: Upload compiled artifacts and provenance digests
        uses: actions/upload-artifact@v4
        with:
          name: agyos-binaries-${{ github.sha }}
          path: |
            target/release/agyos
            target/release/agyos-worker
            target/release/toon
            artifacts.sha256
          retention-days: 7
