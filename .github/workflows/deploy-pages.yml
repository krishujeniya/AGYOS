name: Deploy Documentation to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the successful candidate for this revision
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId')
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: pages-candidate
          run-id: ${{ steps.candidate.outputs.run-id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify the complete candidate file inventory
        run: |
          (cd candidate/_site && find . -type f -print0 | sort -z | xargs -0 sha256sum) > actual-sha256.txt
          diff -u candidate/pages-sha256.txt actual-sha256.txt

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './candidate/_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
