name: Build and Publish Container

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    environment: github-container-registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the successful candidate for this revision
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId')
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: documentation-image-candidate
          run-id: ${{ steps.candidate.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Verify and load the candidate
        run: |
          sha256sum --check documentation-image.sha256
          docker load --input documentation-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="sha-${GITHUB_SHA:0:7}"
          for tag in "$version" latest; do
            docker tag agyos-docs-ci "$repository:$tag"
            docker push "$repository:$tag"
          done
