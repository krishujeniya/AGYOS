<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0B0F19" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="glowRing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="deepGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas with Subtle Border -->
  <rect width="800" height="800" rx="160" fill="url(#bgGlow)"/>
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Autonomous Matrix Geometric Core -->
  <g transform="translate(400, 345)">
    <!-- Outer Precision Orbit Rings -->
    <circle r="230" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 10"/>
    <circle r="190" fill="none" stroke="url(#glowRing)" stroke-width="2.5" stroke-opacity="0.6"/>
    <circle r="150" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8"/>

    <!-- Orbital Synapse Nodes -->
    <circle cx="0" cy="-190" r="7" fill="#00F0FF" filter="url(#softGlow)"/>
    <circle cx="164" cy="95" r="7" fill="#A855F7" filter="url(#softGlow)"/>
    <circle cx="-164" cy="95" r="7" fill="#6366F1" filter="url(#softGlow)"/>

    <!-- Multi-Agent Crystalline Hexagon -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" 
             fill="#0B0F19" stroke="url(#cyanPurple)" stroke-width="4.5" filter="url(#softGlow)"/>

    <!-- Internal Governance Geometry Facets -->
    <polygon points="0,-120 0,120 104,60" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35"/>
    <polygon points="0,-120 0,120 -104,60" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.35"/>
    <polygon points="-104,-60 104,-60 0,120" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Dynamic Energy Core Node -->
    <circle r="46" fill="url(#cyanPurple)" filter="url(#deepGlow)"/>
    <polygon points="0,-26 23,13 -23,13" fill="#FFFFFF"/>
    <circle r="9" fill="#030712"/>
  </g>

  <!-- Typography: Primary Project Title -->
  <text x="400" y="640" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="12" 
        fill="#FFFFFF">
    AGENT <tspan fill="#00F0FF">SKILLS</tspan>
  </text>

  <!-- Subtitle Tagline: By Krish Ujeniya -->
  <text x="400" y="688" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="8" 
        fill="#94A3B8">
    AUTONOMOUS COGNITIVE OS
  </text>

  <!-- Author Badge: By Krish Ujeniya -->
  <g transform="translate(400, 725)">
    <rect x="-130" y="-14" width="260" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <text x="0" y="5" 
          text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#38BDF8">
      BY KRISH UJENIYA
    </text>
  </g>
</svg>
