[package]
name = "agyos-worker"
version = "0.1.0"
edition = "2021"
authors = ["Krish Ujeniya <100012208+krishujeniya@users.noreply.github.com>"]
description = "AGYOS Hosted Worker daemon and Heavy Production Qualification Engine"
license = "MIT"
repository = "https://github.com/krishujeniya/AGYOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
domain = { path = "../../crates/domain" }
store = { path = "../../crates/store" }
runtime = { path = "../../crates/runtime" }
telemetry = { path = "../../crates/telemetry" }
toon-codec = { path = "../../crates/toon-codec" }
sha2 = "0.10"
hex = "0.4"

[lib]
name = "worker"
path = "src/lib.rs"

[[bin]]
name = "agyos-worker"
path = "src/main.rs"
