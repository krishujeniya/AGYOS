<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0B0F19" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="1"/>
    </radialGradient>

    <!-- Core Energy Gradient -->
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="purplePink" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="800" rx="160" fill="url(#bgGlow)"/>
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Orbital Gravity Rings (Antigravity Spine) -->
  <g transform="translate(400, 360)">
    <!-- Outer Precision Ring -->
    <circle r="220" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 12"/>
    <circle r="180" fill="none" stroke="url(#purplePink)" stroke-width="3" stroke-opacity="0.6"/>
    <circle r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8"/>

    <!-- Orbital Nodes (Multi-Model Quorum Nodes) -->
    <circle cx="0" cy="-180" r="8" fill="#22D3EE" filter="url(#neonGlow)"/>
    <circle cx="155" cy="90" r="7" fill="#818CF8" filter="url(#neonGlow)"/>
    <circle cx="-155" cy="90" r="7" fill="#06B6D4" filter="url(#neonGlow)"/>

    <!-- Geometric Hex-Crystal Core (Cognitive Microkernel) -->
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" 
             fill="#0F172A" stroke="url(#cyanIndigo)" stroke-width="5" filter="url(#neonGlow)"/>

    <!-- Inner Refraction Facets -->
    <polygon points="0,-110 0,110 95,55" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="0,-110 0,110 -95,55" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="-95,-55 95,-55 0,110" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Dynamic Central Singularity (Autonomous Engine Core) -->
    <circle r="42" fill="url(#cyanIndigo)" filter="url(#coreGlow)"/>
    <polygon points="0,-24 21,12 -21,12" fill="#FFFFFF"/>
    <circle r="8" fill="#0B0F19"/>
  </g>

  <!-- Typography: AGYOS Wordmark -->
  <text x="400" y="660" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="14" 
        fill="#FFFFFF">
    AGY<tspan fill="#06B6D4">OS</tspan>
  </text>

  <!-- Subtitle: Autonomous Cognitive Standard -->
  <text x="400" y="705" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#94A3B8">
    AUTONOMOUS COGNITIVE OS
  </text>
</svg>
