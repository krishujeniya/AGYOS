<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Monochrome Gradients -->
    <radialGradient id="monoBgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#18181B" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#09090B" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="monoStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <linearGradient id="monoRing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#71717A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Subtle Monochrome Glow Filters -->
    <filter id="whiteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas with Precision Border -->
  <rect width="800" height="800" rx="160" fill="url(#monoBgGlow)"/>
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#27272A" stroke-width="2"/>

  <!-- Autonomous Matrix Geometric Core -->
  <g transform="translate(400, 345)">
    <!-- Outer Precision Orbit Rings -->
    <circle r="230" fill="none" stroke="#27272A" stroke-width="1.5" stroke-dasharray="6 10"/>
    <circle r="190" fill="none" stroke="url(#monoRing)" stroke-width="2"/>
    <circle r="150" fill="none" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="4 8"/>

    <!-- Orbital Synapse Nodes (Pure White) -->
    <circle cx="0" cy="-190" r="6" fill="#FFFFFF" filter="url(#whiteGlow)"/>
    <circle cx="164" cy="95" r="6" fill="#FFFFFF" filter="url(#whiteGlow)"/>
    <circle cx="-164" cy="95" r="6" fill="#FFFFFF" filter="url(#whiteGlow)"/>

    <!-- Multi-Agent Crystalline Hexagon -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" 
             fill="#09090B" stroke="url(#monoStroke)" stroke-width="4" filter="url(#whiteGlow)"/>

    <!-- Internal Governance Geometry Facets -->
    <polygon points="0,-120 0,120 104,60" fill="none" stroke="#71717A" stroke-width="1.2" stroke-opacity="0.4"/>
    <polygon points="0,-120 0,120 -104,60" fill="none" stroke="#A1A1AA" stroke-width="1.2" stroke-opacity="0.4"/>
    <polygon points="-104,-60 104,-60 0,120" fill="none" stroke="#D4D4D8" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Dynamic Energy Core Node (Monochrome) -->
    <circle r="44" fill="#18181B" stroke="#FFFFFF" stroke-width="2" filter="url(#coreGlow)"/>
    <polygon points="0,-24 21,12 -21,12" fill="#FFFFFF"/>
    <circle r="8" fill="#000000"/>
  </g>

  <!-- Typography: AGYOS Wordmark (Monochrome White) -->
  <text x="400" y="640" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="14" 
        fill="#FFFFFF">
    AGYOS
  </text>

  <!-- Subtitle Tagline -->
  <text x="400" y="688" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" 
        font-size="15" 
        font-weight="700" 
        letter-spacing="8" 
        fill="#A1A1AA">
    AUTONOMOUS COGNITIVE OS
  </text>

  <!-- Author Badge: By Krish Ujeniya -->
  <g transform="translate(400, 725)">
    <rect x="-130" y="-14" width="260" height="28" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="1.2"/>
    <text x="0" y="5" 
          text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#FAFAFA">
      BY KRISH UJENIYA
    </text>
  </g>
</svg>